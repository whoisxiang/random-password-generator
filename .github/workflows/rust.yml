name: Rust

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]          # 推 v 开头的 tag 时触发发布
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write           # 创建 Release 必须，缺了会报 Resource not accessible

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          Compress-Archive -Path target/release/*.exe -DestinationPath "random-password-generator-v$ver-windows-x86_64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: random-password-generator-windows-x86_64
          path: "*.zip"
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
          draft: false
